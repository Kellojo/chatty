services:
  app:
    build: .
    ports:
      - '3000:3000'
    env_file: .env
    volumes:
      - data:/data
      - memory:/memory
      - skills:/skills
      - documents:/documents
      - workspaces:/workspaces
    restart: unless-stopped

volumes:
  data:
  memory:
  skills:
  documents:
  workspaces:
